name: SKB DEV - Agent Mimi Life OS Engine (APK Builder)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Core Codebase
        uses: actions/checkout@v4

      - name: 2. Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev libsqlite3-dev ccache
          pip install --upgrade pip
          pip install buildozer "cython<3.0.0"

      - name: 4. Link Pre-installed System Android SDK & Build-Tools
        run: |
          # Clear any corrupted cache directories
          rm -rf ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform
          
          # Symlink GitHub Runner's pre-installed Android SDK ($ANDROID_HOME)
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
          
          # Pre-accept all system SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Compile Android APK Matrix
        run: |
          buildozer android debug

      - name: 6. Upload Generated Life OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Mimi-LifeOS-v12.0.0
          path: bin/*.apk
          if-no-files-found: error
