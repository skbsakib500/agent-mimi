name: SKB DEV - Agent Mimi Life OS Engine (APK Builder)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Core Codebase
        uses: actions/checkout@v4

      - name: 2. Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev libsqlite3-dev ccache
          pip install --upgrade pip
          pip install buildozer "cython<3.0.0"

      - name: 4. Restore Buildozer Cache (Speed Optimization)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: 5. Pre-Inject Android SDK Licenses into Buildozer Directory
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # Inject official SHA1 license hashes to bypass interactive prompt
          echo -e "\n89330172245f2650b1035c9927328397754117d0\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63718c309d6089f2781112c1b0736f77\n3698766f0145705696b721a371dbe5ed13224001\n84831b94fe705e206220d96122d32e5235685c47\n7a5973e02845b6ac7017b51a4041c12970121693\n33b622b2e2020397f32d43632f0c2a20b784a3c1" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b94fe705e206220d96122d32e5235685c47" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo -e "\nd97545517057a861a3f08cce72314560a80e1189" > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license

          # Copy system licenses as additional fallback
          if [ -d "$ANDROID_HOME/licenses" ]; then
            cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          fi

      - name: 6. Compile Android APK Matrix
        run: |
          buildozer android debug

      - name: 7. Upload Generated Life OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Mimi-LifeOS-v12.0.0
          path: bin/*.apk
          if-no-files-found: error
