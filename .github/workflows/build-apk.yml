name: SKB DEV - Agent Mimi Life OS Engine (APK Builder)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Core Codebase
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 2. Set up Java 17 Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev libsqlite3-dev ccache
          pip install --upgrade pip
          pip install buildozer "cython<3.0.0"

      - name: 5. Bridge Android SDK (Fix Libs & Binaries Path)
        run: |
          # Clean broken cache/symlinks
          rm -rf ~/.buildozer/android/platform/android-sdk
          mkdir -p ~/.buildozer/android/platform

          # Correctly link cmdline-tools/latest -> tools (preserves both bin and lib)
          sudo rm -rf $ANDROID_HOME/tools
          sudo ln -sf $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools

          # Link system Android SDK to Buildozer
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

          # Accept SDK Licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 6. Compile Android APK Matrix
        run: |
          buildozer android debug

      - name: 7. Upload Generated Life OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Mimi-LifeOS-v12.0.0
          path: bin/*.apk
          if-no-files-found: error
