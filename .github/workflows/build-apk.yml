name: SKB DEV - Agent Mimi Life OS Engine (APK Builder)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Core Codebase
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 2. Set up Java 17 Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. Install Native Build Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev ccache cmake ninja-build lld \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
          pip install --upgrade pip setuptools
          pip install "cython==0.29.36" buildozer

      - name: 5. Pre-setup Android Cmdline-tools & Accept Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9441835_latest.zip -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          rm -rf /tmp/cmdline /tmp/cmdline.zip

          SDKMGR="$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          yes | $SDKMGR --sdk_root=$SDK_ROOT --licenses || true
          yes | $SDKMGR --sdk_root=$SDK_ROOT "build-tools;33.0.2" "platforms;android-33" "platform-tools" || true

      - name: 6. Compile Android APK Matrix
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSES: '1'
          ACCEPT_SDK_LICENSES: '1'
        run: |
          buildozer android debug

      - name: 7. Upload Generated Life OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Mimi-LifeOS-v12.0.0
          path: bin/*.apk
          if-no-files-found: error
