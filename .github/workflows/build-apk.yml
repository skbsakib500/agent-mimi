name: Build Agent Mimi APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Android SDK & Legacy Tools Path
        run: |
          mkdir -p /github/home/.buildozer/android/platform/android-sdk/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses

          # Download and setup commandline-tools in both paths
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9441835_latest.zip -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline

          for SDK_DIR in "/github/home/.buildozer/android/platform/android-sdk" "~/.buildozer/android/platform/android-sdk"; do
            eval SDK_DIR_EXP="$SDK_DIR"
            mkdir -p "$SDK_DIR_EXP/cmdline-tools/latest"
            cp -r /tmp/cmdline/cmdline-tools/* "$SDK_DIR_EXP/cmdline-tools/latest/"
            
            # Create legacy 'tools' symlink so buildozer finds tools/bin/sdkmanager
            mkdir -p "$SDK_DIR_EXP/tools"
            ln -sfn "$SDK_DIR_EXP/cmdline-tools/latest/bin" "$SDK_DIR_EXP/tools/bin"
            ln -sfn "$SDK_DIR_EXP/cmdline-tools/latest/lib" "$SDK_DIR_EXP/tools/lib"
          done

          rm -rf /tmp/cmdline /tmp/cmdline.zip

          # Pre-seed license hashes
          LIC_HASHES="89330172245f2650b1035c9927328397754117d0\n24333f8a63718c309d6089f2781112c1b0736f77\nd56f5187479451eabf01fb78af6dfcb131a6481e\n3698766f0145705696b721a371dbe5ed13224001\n84831b94fe705e206220d96122d32e5235685c47\n7a5973e02845b6ac7017b51a4041c12970121693\n33b622b2e2020397f32d43632f0c2a20b784a3c1\ne67562094832f9e72638be402813fd923d3501c1"

          printf "$LIC_HASHES" > /github/home/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf "84831b94fe705e206220d96122d32e5235685c47\n" > /github/home/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build APK with Buildozer
        run: |
          echo "y" | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Mimi-Debug-APK
          path: bin/*.apk
          if-no-files-found: error
