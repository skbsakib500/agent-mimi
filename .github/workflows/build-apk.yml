name: SKB DEV - Agent Mimi Life OS Engine (APK Builder)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Core Codebase
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 2. Set up Java 17 Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. Install Native Build Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev ccache cmake ninja-build lld \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
          pip install --upgrade pip setuptools
          pip install "cython==0.29.36" buildozer

      - name: 5. Pre-accept Android SDK Licenses globally & inside Buildozer
        run: |
          mkdir -p ~/.android/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses

          LIC_HASHES="\n89330172245f2650b1035c9927328397754117d0\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63718c309d6089f2781112c1b0736f77\n3698766f0145705696b721a371dbe5ed13224001\n84831b94fe705e206220d96122d32e5235685c47\n7a5973e02845b6ac7017b51a4041c12970121693\n33b622b2e2020397f32d43632f0c2a20b784a3c1\ne67562094832f9e72638be402813fd923d3501c1"

          echo -e "$LIC_HASHES" > ~/.android/licenses/android-sdk-license
          echo -e "$LIC_HASHES" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

          echo -e "\n84831b94fe705e206220d96122d32e5235685c47" > ~/.android/licenses/android-sdk-preview-license
          echo -e "\n84831b94fe705e206220d96122d32e5235685c47" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 6. Compile Android APK Matrix
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSES: '1'
          ACCEPT_SDK_LICENSES: '1'
        run: |
          buildozer android debug

      - name: 7. Upload Generated Life OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Mimi-LifeOS-v12.0.0
          path: bin/*.apk
          if-no-files-found: error
